apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks
  namespace: healthchecks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: healthchecks
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: homelab/k8s-healthchecks/secret-key
        property: value
    - secretKey: SUPERUSER_PASSWORD
      remoteRef:
        key: homelab/k8s-healthchecks/superuser-password
        property: value

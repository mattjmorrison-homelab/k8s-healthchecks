name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mattjmorrison-homelab/actions-helm@401a93a8bd19fead4556ae919068f374f1ab958c # add-backstage-catalog-info
        with:
          namespace: healthchecks
          # No live dry-run (healthchecks namespace lacks a `healthchecks-ci`
          # ServiceAccount yet; see k8s-ci-rbac). helm lint/template still runs.
          dry-run: "false"
